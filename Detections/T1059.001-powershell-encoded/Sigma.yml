title: PowerShell Encoded Command Execution
id: 8e1c2a3b-4f5d-6e7f-8a9b-0c1d2e3f4a5b
status: experimental
description: Detects the execution of PowerShell with an encoded (Base64) command...
author: Julio Cesar Hernandez Tibrey
date: 2026/10/23
references:
    - https://attack.mitre.org/techniques/T1059/001/
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith: '\powershell.exe'
        - OriginalFileName: 'PowerShell.EXE'
    selection_cli:
        CommandLine|contains: 
            - '-EncodedCommand'
            - '-enc '  
            - '-ec '   
    condition: all of selection_*
falsepositives:
    - System administrators running legitimate but encoded scripts (rare).
level: high
